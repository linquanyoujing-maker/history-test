<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的历史原型 · 人格测试</title>
<style>

  html{scroll-behavior:smooth}

  /* ---------- 开场 ---------- */

    margin-bottom:22px;opacity:.9
  }
  #intro h1{
    font-size:clamp(34px,8vw,52px);letter-spacing:.06em;line-height:1.25;

  }
  .lead{font-size:15.5px;color:#a9a49a;max-width:460px;margin:0 auto 30px;line-height:1.9}

    font-size:12.5px;color:#8e897f;border:1px solid rgba(255,255,255,.1);

  }

    display:inline-block;border:none;cursor:pointer;font-family:inherit;font-size:15px;

  }

    background:transparent;color:#c9a227;border:1px solid rgba(201,162,39,.45);

  }

  #quiz{padding-top:52px}

  .progress{height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:14px}

  .options{display:flex;flex-direction:column;gap:12px}

    display:flex;gap:15px;align-items:flex-start;text-align:left;cursor:pointer;
    background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.075);

  .opt:hover .mark{background:#c9a227;color:#161208;border-color:#c9a227}
  .opt.picked{background:rgba(212,175,55,.16);border-color:#c9a227}
  .opt.picked .mark{background:#c9a227;color:#161208}
  .fade-out{opacity:0;transform:translateY(-10px);transition:.24s}

  /* ---------- 结果 ---------- */
  #result{padding-top:48px}
  .res-head{text-align:center;margin-bottom:38px}
  .proto-name{
    font-size:clamp(42px,11vw,68px);letter-spacing:.14em;line-height:1.2;margin:6px 0 14px;
    background:linear-gradient(165deg,#fffbe9 5%,#e8c96a 50%,#a8863a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

    display:inline-block;font-size:12.5px;letter-spacing:.22em;color:#c9a227;
    border:1px solid rgba(201,162,39,.4);padding:6px 20px;border-radius:999px;margin-bottom:14px
  }
  .proto-id{font-size:13.5px;color:#8e897f;letter-spacing:.05em}

  .bars{margin:34px 0 40px;display:flex;flex-direction:column;gap:11px}
  .barrow{display:flex;align-items:center;gap:12px;font-size:12.5px}
  .barlabel{flex:0 0 88px;color:#8e897f;letter-spacing:.06em;text-align:right}
  .bartrack{flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:7px;overflow:hidden}
  .barfill{height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#6d6350,#8d8064);
    transition:width .9s cubic-bezier(.25,.9,.3,1)}
  .barrow.hi .barlabel{color:#e8c96a;font-weight:700}
  .barrow.hi .barfill{background:linear-gradient(90deg,#b8912f,#e8c96a)}
  .barval{flex:0 0 26px;color:#6f6a61;font-variant-numeric:tabular-nums}
  .barrow.hi .barval{color:#e8c96a}

  .card{
    background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.07);
    border-radius:17px;padding:24px 24px 22px;margin-bottom:14px
  }
  .card h3{
    font-size:14px;letter-spacing:.2em;color:#c9a227;margin-bottom:14px;
    display:flex;align-items:center;gap:10px
  }
  .card h3::before{content:"";width:16px;height:1px;background:#c9a227;opacity:.7}
  .card p{font-size:15px;color:#cdc8be;line-height:1.95}
  .card ul{list-style:none;display:flex;flex-direction:column;gap:9px}
  .card li{font-size:14.5px;color:#cdc8be;line-height:1.8;padding-left:18px;position:relative}

    border-left:2px solid #c9a227;padding:2px 0 2px 18px;font-family:"Songti SC","STSong",serif;

  }
  .quote{
    text-align:center;font-family:"Songti SC","STSong",serif;font-size:17px;
    color:#e8c96a;line-height:2;letter-spacing:.04em;padding:26px 14px 6px
  }
  .res-actions{text-align:center;margin-top:36px}
  .note{text-align:center;font-size:12px;color:#66625b;margin-top:18px;letter-spacing:.06em}

</head>
<body>
<div class="wrap">

  <!-- ======== 开场 ======== -->
  <section id="intro" class="screen active">
    <p class="kicker">Personality · History · Archetype</p>
    <h1>我的历史原型</h1>
    <p class="lead">12 道题，找出与你灵魂共振的那个历史人物。<br>可能是秦始皇，也可能是李白。</p>
    <ul class="meta">
      <li>共 12 题</li>
      <li>约 3 分钟</li>
      <li>凭第一直觉作答</li>
    </ul>
    <button class="btn" id="startBtn">开 始 测 试</button>
  </section>

  <!-- ======== 答题 ======== -->
  <section id="quiz" class="screen">
    <div class="quiz-head">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="counter"><span id="cur">1</span> / 12</div>
    </div>
    <div id="qwrap">
      <h2 class="qtext" id="qtext"></h2>
      <div class="options" id="options"></div>
    </div>
  </section>

  <!-- ======== 结果 ======== -->
  <section id="result" class="screen"></section>

</div>

<script>
/* =========================================================

   维度：P权力 O秩序 F自由 R理性 E共情 A冒险
   ========================================================= */
const QUESTIONS = [
  { q:"当你接手一个混乱的团队项目，你首先会：", opts:[
    { t:"明确目标、分工和截止时间，让所有人各就各位。", s:{P:2,O:1} },
    { t:"梳理现有资源和流程，找出最关键的问题。",       s:{O:2,R:1} },
    { t:"打破原方案，提出一个更自由、更有创意的新方向。", s:{F:2,A:1} },
    { t:"先和核心成员深聊，分析各方动机与利益。",       s:{R:2,E:1} }
  ]},
  { q:"你突然得到一个高风险但可能改变命运的机会，你会：", opts:[
    { t:"先考虑它会如何影响身边人和团队，再决定。", s:{E:2,F:1} },
    { t:"凭直觉抓住它，边做边学，享受未知。",       s:{A:2,P:1} },
    { t:"迅速判断谁能帮你，并争取主导权。",         s:{P:2,O:1} },
    { t:"列出收益、成本和最坏情况，按计划推进。",   s:{O:2,R:1} }
  ]},
  { q:"面对一条你并不认同的权威规则，你通常：", opts:[
    { t:"直接质疑它，按自己的方式行动。",           s:{F:2,A:1} },
    { t:"表面遵守，暗中寻找更聪明的解法。",         s:{R:2,E:1} },
    { t:"理解制定规则者的难处，尝试温和沟通。",     s:{E:2,F:1} },
    { t:"挑战权威，用行动证明新规则更好。",         s:{A:2,P:1} }
  ]},
  { q:"你更享受哪一种成就感？", opts:[
    { t:"建立一套能长久运转的制度，让事情有秩序。", s:{P:2,O:1} },
    { t:"把复杂混乱的信息整理成清晰体系。",         s:{O:2,R:1} },
    { t:"创作一件别人从未做过的作品。",             s:{F:2,A:1} },
    { t:"看透一个难题背后的规律，并帮助他人理解。", s:{R:2,E:1} }
  ]},
  { q:"朋友做了让你失望的事，你第一反应是：", opts:[
    { t:"感到受伤，但试着理解他的处境。",           s:{E:2,F:1} },
    { t:"立刻切断联系，去探索新的关系和生活。",     s:{A:2,P:1} },
    { t:"直接指出问题，要求他给出解释和补偿。",     s:{P:2,O:1} },
    { t:"冷静评估这段关系是否还值得继续。",         s:{O:2,R:1} }
  ]},
  { q:"你理想中的生活更接近：", opts:[
    { t:"无拘无束，随时可以出发去冒险。",           s:{F:2,A:1} },
    { t:"不断学习，靠智慧解决难题并理解世界。",     s:{R:2,E:1} },
    { t:"和所爱之人互相支持，让周围人过得更好。",   s:{E:2,F:1} },
    { t:"有影响力，能推动大事，留下自己的印记。",   s:{A:2,P:1} }
  ]},
  { q:"在陌生社交场合，你通常会：", opts:[
    { t:"观察谁是关键人物，并主动建立联系。",       s:{P:2,O:1} },
    { t:"先了解场合规则和话题，再稳妥加入。",       s:{O:2,R:1} },
    { t:"找有趣的人聊新鲜想法，不在乎是否合群。",   s:{F:2,A:1} },
    { t:"倾听不同人的故事，分析他们的性格和动机。", s:{R:2,E:1} }
  ]},
  { q:"你最容易被人批评为：", opts:[
    { t:"太敏感、太心软，总替别人考虑。",           s:{E:2,F:1} },
    { t:"太冲动、太爱冒险，不顾后果。",             s:{A:2,P:1} },

  ]},
  { q:"如果必须牺牲一样，你最难放弃：", opts:[
    { t:"自由和独立。",                             s:{F:2,A:1} },
    { t:"理性和真相。",                             s:{R:2,E:1} },
    { t:"爱与联结。",                               s:{E:2,F:1} },
    { t:"权力和影响力。",                           s:{A:2,P:1} }
  ]},
  { q:"面对一个长期目标，你更倾向：", opts:[
    { t:"制定详细计划，分配资源，严格推进。",       s:{P:2,O:1} },
    { t:"建立稳定流程，定期检查，逐步优化。",       s:{O:2,R:1} },
    { t:"保持灵活，随时根据灵感调整方向。",         s:{F:2,A:1} },
    { t:"研究底层逻辑，找到最高效的路径。",         s:{R:2,E:1} }
  ]},
  { q:"你心目中的英雄更像：", opts:[
    { t:"为弱者发声、推动公平的人。",               s:{E:2,F:1} },
    { t:"探索未知、突破边界的人。",                 s:{A:2,P:1} },
    { t:"统一乱世、建立秩序的人。",                 s:{P:2,O:1} },
    { t:"看透人性、以智取胜的人。",                 s:{O:2,R:1} }
  ]},
  { q:"临终时，你希望被记住为：", opts:[
    { t:"我活出了真实的自己。",                     s:{F:2,A:1} },
    { t:"我理解并解释了世界。",                     s:{R:2,E:1} },
    { t:"我爱过，也被爱过。",                       s:{E:2,F:1} },
    { t:"我建立了不朽的事业。",                     s:{A:2,P:1} }
  ]}
];

/* ========================= 原型数据 ========================= */

    traits:["目标感极强，认定方向后能承受巨大压力推进","擅长建立结构、标准和长期工程","对效率、执行、统一有天然执念","不喜欢模棱两可、拖泥带水、各说各话"],

    quote:"你不是在参与游戏，你是在重写规则。" },

    core:"你是乱局中的务实者。你不迷信道德口号，也不被情绪左右，你关心的是：谁能用、怎么赢、代价是什么。",

    strengths:["战略眼光","应变能力","组织人才","看透动机"],
    shadows:["多疑、冷酷","容易被争议包围","很难完全信任他人"],

    roles:"领导者 · 调解者 · 公共事务推动者 · 团队凝聚者",

  FP:{ name:"武则天", tag:"权力 × 自由", id:"中国历史上唯一的女皇帝 · 打破性别与礼制束缚，执掌唐朝数十年",

const DIM_META = {
  P:{label:"权力·领导"},
  O:{label:"秩序·责任"},
  F:{label:"自由·叛逆"},
  R:{label:"理性·谋略"},
  E:{label:"共情·人文"},
  A:{label:"冒险·创造"}
};
const DIM_ORDER = ["P","O","F","R","E","A"];

/* ========================= 状态与逻辑 ========================= */
let current = 0;
let scores = {P:0,O:0,F:0,R:0,E:0,A:0};

const $ = id => document.getElementById(id);
const screens = { intro:$("intro"), quiz:$("quiz"), result:$("result") };

function show(name){
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
  window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
}

function reset(){
  current = 0;
  scores = {P:0,O:0,F:0,R:0,E:0,A:0};
}

/* ---------- 渲染题目 ---------- */
function renderQuestion(){
  const q = QUESTIONS[current];
  $("cur").textContent = current + 1;
  $("bar").style.width = ((current) / QUESTIONS.length * 100) + "%";

  const wrap = $("qwrap");
  wrap.classList.remove("fade-out");

  $("qtext").textContent = q.q;
  const box = $("options");
  box.innerHTML = "";

  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="mark">${"ABCD"[i]}</span><span>${opt.t}</span>`;
    btn.addEventListener("click", () => pick(btn, opt.s));
    box.appendChild(btn);
  });
}

/* ---------- 选择答案 ---------- */
let locked = false;
function pick(btn, scoreObj){
  if (locked) return;
  locked = true;
  btn.classList.add("picked");

  for (const k in scoreObj) scores[k] += scoreObj[k];

  $("bar").style.width = ((current + 1) / QUESTIONS.length * 100) + "%";

  setTimeout(() => {
    $("qwrap").classList.add("fade-out");
    setTimeout(() => {
      current++;
      locked = false;
      if (current < QUESTIONS.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }, 240);
  }, 260);
}

/* ---------- 计算结果 ---------- */
function computeResult(){
  const ranked = DIM_ORDER.slice().sort((a,b) =>
    (scores[b] - scores[a]) || (DIM_ORDER.indexOf(a) - DIM_ORDER.indexOf(b))
  );
  const top = ranked[0], second = ranked[1];
  const key = [top, second].sort().join("");
  return { top, second, proto: PROTOTYPES[key] };
}

/* ---------- 渲染结果 ---------- */
function showResult(){
  const { top, second, proto } = computeResult();
  const maxScore = Math.max(...DIM_ORDER.map(d => scores[d]), 1);

  const barRows = DIM_ORDER.map(d => {
    const hi = (d === top || d === second) ? " hi" : "";
    const w = Math.round(scores[d] / maxScore * 100);
    return `<div class="barrow${hi}">
      <span class="barlabel">${DIM_META[d].label}</span>
      <span class="bartrack"><span class="barfill" data-w="${w}"></span></span>
      <span class="barval">${scores[d]}</span>
    </div>`;
  }).join("");

  const li = arr => arr.map(x => `<li>${x}</li>`).join("");

  $("result").innerHTML = `
    <div class="res-head">
      <p class="kicker">你的历史原型是</p>
      <h1 class="proto-name">${proto.name}</h1>
      <div class="proto-tag">${proto.tag}</div>
      <p class="proto-id">${proto.id}</p>
    </div>

    <div class="bars">${barRows}</div>

    <div class="card">
      <h3>核心</h3>
      <p>${proto.core}</p>
    </div>

    <div class="card">
      <h3>你的性格画像</h3>
      <ul>${li(proto.traits)}</ul>
    </div>

    <div class="card">
      <h3>你的优势</h3>
      <ul>${li(proto.strengths)}</ul>
    </div>

    <div class="card">
      <h3>你的阴影</h3>
      <ul>${li(proto.shadows)}</ul>
    </div>

    <div class="card">
      <h3>命运隐喻</h3>
      <p class="metaphor">${proto.metaphor}</p>
    </div>

    <div class="card">
      <h3>适合你的角色</h3>
      <p>${proto.roles}</p>
    </div>

    <p class="quote">「 ${proto.quote} 」</p>

    <div class="res-actions">
      <button class="btn ghost" id="againBtn">再 测 一 次</button>
    </div>
    <p class="note">测试结果仅供自我探索参考，你永远比任何原型都更复杂。</p>
  `;

  show("result");

  // 进度条动画
  requestAnimationFrame(() => {
    setTimeout(() => {
      document.querySelectorAll(".barfill").forEach(el => {
        el.style.width = el.dataset.w + "%";
      });
    }, 120);
  });

  $("againBtn").addEventListener("click", () => {
    reset();
    renderQuestion();
    show("quiz");
  });
}

/* ---------- 启动 ---------- */
$("startBtn").addEventListener("click", () => {
  reset();
  renderQuestion();
  show("quiz");
});
</script>
